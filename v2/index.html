<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Skyline Racing Concept</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #101014;
            overflow: hidden;
        }

        #canvas {
            display: block;
            width: 100%;
            height: 100%;
            outline: none;
            border: none;
        }

        #status {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.25rem;
            font-family: 'Lucida Console', Monaco, monospace;
            color: #e8e8ee;
            background: #101014;
        }

        #status[hidden] {
            display: none;
        }

        #status-progress {
            width: min(60vw, 32rem);
            height: 0.4rem;
        }

        #status-notice {
            max-width: min(80vw, 48rem);
            white-space: pre-wrap;
            text-align: center;
            line-height: 1.5;
            color: #ff9d9d;
        }
    </style>
</head>
<body>
    <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>

    <div id="status">
        <div>Skyline Racing Concept</div>
        <progress id="status-progress" aria-label="Loading progress"></progress>
        <div id="status-notice" role="alert"></div>
    </div>

    <script>
        // The NativeAOT-LLVM host has no boot API of its own (the Mono host gets
        // Engine.startGame from godot.js), so this page supplies the pieces the
        // engine's own emscripten bootstrap expects:
        //   1. the canvas, via GodotConfig.initConfig,
        //   2. godot.pck in MEMFS before main runs,
        //   3. main's argv, via Module.arguments.
        // main itself is invoked by the module (INVOKE_RUN is at its default),
        // so nothing here calls callMain.
        var statusOverlay = document.getElementById('status');
        var statusProgress = document.getElementById('status-progress');
        var statusNotice = document.getElementById('status-notice');

        function fail(err) {
            console.error(err);
            statusNotice.textContent = (err && err.message) ? err.message : String(err);
            statusProgress.hidden = true;
            statusOverlay.hidden = false;
        }

        var Module = {
            // --main-pack takes a path inside the virtual filesystem, which is
            // what preRun below writes.
            arguments: ['--main-pack', '/godot.pck'],

            locateFile: function (path) {
                return path;
            },

            preRun: [function () {
                // Holds up main (and the call to it) until the pack is in place:
                // an unsettled dependency makes run() defer itself.
                Module.addRunDependency('godot.pck');
                var request = new XMLHttpRequest();
                request.open('GET', 'godot.pck', true);
                request.responseType = 'arraybuffer';
                request.onprogress = function (event) {
                    if (event.lengthComputable) {
                        statusProgress.value = event.loaded;
                        statusProgress.max = event.total;
                    }
                };
                request.onload = function () {
                    try {
                        if (request.status !== 200 && request.status !== 0) {
                            throw new Error('godot.pck: HTTP ' + request.status);
                        }
                        Module.FS.writeFile('/godot.pck', new Uint8Array(request.response));

                        // The engine reads the canvas through GodotConfig, not
                        // Module.canvas: godot_js_config_canvas_id_get derives
                        // the element id from it and GodotDisplay measures it.
                        // Must precede main, hence preRun rather than
                        // onRuntimeInitialized.
                        Module.initConfig({
                            canvas: document.getElementById('canvas'),
                            canvasResizePolicy: 2,
                            focusCanvas: true,
                        });
                    } catch (err) {
                        fail(err);
                    }
                    statusProgress.hidden = true;
                    Module.removeRunDependency('godot.pck');
                };
                request.onerror = function () {
                    fail(new Error('godot.pck could not be fetched'));
                    Module.removeRunDependency('godot.pck');
                };
                request.send(null);
            }],

            print: function (text) { console.log(text); },
            printErr: function (text) { console.error(text); },

            onRuntimeInitialized: function () {
                // Reached after preRun, just before main starts. The module's
                // own frame loop owns the tab from here; the overlay is cleared
                // on the first frame so it does not sit over a running engine.
                requestAnimationFrame(function () { statusOverlay.hidden = true; });
            },
        };

        window.addEventListener('error', function (event) {
            fail(event.error || event.message);
        });
    </script>
    <!-- Classic script: it reads the Module object above at load time, so it
         must not be deferred or reordered ahead of it. -->
    <script async src="SkylineRacingConcept.web.aot.js"></script>
</body>
</html>
